# Render blueprint for the ZELDA backend + web client.
# The live service is zelda-api-kbtl (repo bragee7/z111111), auto-deploy on push to main.
# This file is kept in sync with that deployment so it can be recreated/audited.
services:
  - type: web
    name: zelda-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromSecret: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_ANON_KEY
        fromSecret: SUPABASE_ANON_KEY
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: SENDGRID_API_KEY
        fromSecret: SENDGRID_API_KEY
      - key: EMAIL_FROM
        value: ZELDA <zyracmt@gmail.com>
      - key: POLICE_EMAIL
        value: police@guardian.com
      - key: CLIENT_URL
        value: https://zelda-api-kbtl.onrender.com
      - key: API_URL
        value: https://zelda-api-kbtl.onrender.com
